<div class="container-fluid mt-2" style="font-family: 'Outfit', sans-serif; max-width: 600px;">
  <div class="d-flex align-items-center gap-2 mb-4">
    <a class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" routerLink="/stock/history">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="fw-bold text-dark mb-0">Record Stock-Out</h2>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4 bg-white">
      <form [formGroup]="stockOutForm" (ngSubmit)="onSubmit()">
        
        <!-- Product Select -->
        <div class="mb-3">
          <label for="product" class="form-label small fw-semibold text-muted">Select Product</label>
          <select id="product" formControlName="product" class="form-select">
            <option value="">-- Choose Product --</option>
            @for (product of products; track product._id) {
              <option [value]="product._id">{{ product.productName }} (SKU: {{ product.sku }}) - Available: {{ product.availableQuantity }}</option>
            }
          </select>
          @if (stockOutForm.get('product')?.touched && stockOutForm.get('product')?.invalid) {
            <div class="text-danger small mt-1">Please select a product.</div>
          }
        </div>

        <!-- Quantity -->
        <div class="mb-3">
          <label for="quantity" class="form-label small fw-semibold text-muted">Stock-Out Quantity</label>
          <input type="number" id="quantity" formControlName="quantity" class="form-control" placeholder="Enter positive quantity">
          @if (stockOutForm.get('quantity')?.touched && stockOutForm.get('quantity')?.invalid) {
            <div class="text-danger small mt-1">Quantity must be 1 or greater.</div>
          }
        </div>

        <!-- Remarks -->
        <div class="mb-4">
          <label for="remarks" class="form-label small fw-semibold text-muted">Remarks / Comments</label>
          <textarea id="remarks" formControlName="remarks" rows="3" class="form-control" placeholder="e.g. Dispatched to client, sales invoice #SI-1209"></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn btn-outline-secondary fw-semibold" routerLink="/stock/history">Cancel</a>
          <button type="submit" class="btn btn-primary fw-semibold px-4 d-flex align-items-center gap-2" [disabled]="loading">
            @if (loading) {
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            }
            <span>Remove Stock-Out</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
