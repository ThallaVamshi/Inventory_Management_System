<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-warning">
      <h3>Edit Product</h3>
    </div>

    <div class="card-body">

      <div *ngIf="loading" class="text-center">
        <div class="spinner-border"></div>
        <p class="mt-3">Loading Product...</p>
      </div>

      <form
        *ngIf="!loading"
        [formGroup]="productForm"
        (ngSubmit)="updateProduct()">

        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="productName">
        </div>

        <div class="mb-3">
          <label class="form-label">SKU</label>
          <input
            type="text"
            class="form-control"
            formControlName="sku">
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <input
            type="text"
            class="form-control"
            formControlName="category">
        </div>

        <div class="mb-3">
          <label class="form-label">Unit Price</label>
          <input
            type="number"
            class="form-control"
            formControlName="unitPrice">
        </div>

        <div class="mb-3">
          <label class="form-label">Unit Of Measure</label>
          <input
            type="text"
            class="form-control"
            formControlName="unitOfMeasure">
        </div>

        <div class="mb-3">
          <label class="form-label">Reorder Level</label>
          <input
            type="number"
            class="form-control"
            formControlName="reorderLevel">
        </div>

        <div class="mb-3">
          <label class="form-label">Available Quantity</label>
          <input
            type="number"
            class="form-control"
            formControlName="availableQuantity">
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea
            rows="4"
            class="form-control"
            formControlName="description"></textarea>
        </div>

        <button
          type="submit"
          class="btn btn-success">
          Update Product
        </button>

        <button
          type="button"
          class="btn btn-secondary ms-2"
          routerLink="/products">
          Cancel
        </button>

      </form>

    </div>

  </div>

</div>
