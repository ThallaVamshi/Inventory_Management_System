services:
  - type: web
    name: inventory-management-system
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
